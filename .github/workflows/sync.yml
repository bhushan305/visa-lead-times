name: Daily Supabase Sync

# Runs the Apps Script → Supabase sync once a day at 9 AM Pacific (17:00 UTC).
# Apps Script's own daily Chrome MCP scrape writes the sheet at 9 AM PT; this
# job runs shortly after so the latest snapshot lands in Supabase the same day.
#
# Free tier: unlimited minutes on public repos, 2000 min/mo on private. One run
# uses ~1 minute. Trigger manually anytime via the "Run workflow" button on the
# Actions tab.

on:
  schedule:
    - cron: "30 17 * * *" # 9:30 AM PT (gives Apps Script a 30-min head start)
  workflow_dispatch: # adds a manual-trigger button in the GitHub UI

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install deps
        # Use `npm install` (not `npm ci`) because lockfile drift between
        # local npm and the runner's npm version was causing EUSAGE errors.
        # `install` resolves the dependency tree fresh — slightly slower but
        # tolerates lockfile/package.json mismatches. Fine for a daily cron.
        run: npm install --no-audit --no-fund --legacy-peer-deps

      - name: Run sync
        # Use `sync:ci` (not `sync`) — the local `sync` script loads .env.local
        # via tsx --env-file, which errors in CI where that file doesn't exist.
        # `sync:ci` reads from process.env, which the workflow populates below.
        run: npm run sync:ci
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          APPS_SCRIPT_URL: ${{ secrets.APPS_SCRIPT_URL }}

      - name: Fail if the USCIS scrape has gone stale
        # The scrape itself runs in Chrome on Bhushan's Mac (Claude scheduled
        # task "USCIS daily scrape", scripts/uscis-scrape.browser.js) because
        # USCIS blocks datacenter IPs. If it stops, the sync above still passes
        # with old data, which is how the site silently went stale from
        # 2026-09-21 to 2026-10-17. Failing here makes GitHub email an alert.
        run: |
          URL="${APPS_SCRIPT_URL:-https://script.google.com/macros/s/AKfycbwF37kFPBEYOCS9t33Ai5gzoL_XkYBFfMsKzCt9SameFmPf30wOQkqbbqn53njCdrAZ/exec}"
          curl -fsSL "$URL?tab=run_log" -o run_log.json
          node -e '
            const rows = JSON.parse(require("fs").readFileSync("run_log.json", "utf8")).rows || [];
            const last = rows.map(r => Date.parse(r.run_timestamp_pt)).filter(Number.isFinite).sort((a, b) => b - a)[0];
            if (!last) { console.error("Run_Log is empty"); process.exit(1); }
            const hours = (Date.now() - last) / 36e5;
            console.log(`Last USCIS scrape: ${new Date(last).toISOString()} (${hours.toFixed(1)}h ago)`);
            if (hours > 50) {
              console.error("::error::USCIS scrape is stale (>50h). Check the \"USCIS daily scrape\" scheduled task and that Chrome is running on the Mac.");
              process.exit(1);
            }
          '
        env:
          APPS_SCRIPT_URL: ${{ secrets.APPS_SCRIPT_URL }}
